<!-- Remplacez VOTRE-COMPTE par votre nom d'utilisateur GitHub. -->
<div style="width:100%; overflow:hidden;">
  <iframe
    id="solix-simulator"
    src="https://VOTRE-COMPTE.github.io/marine-corail-solix-simulator/"
    title="Simulateur Anker SOLIX Marine Corail"
    style="width:100%; height:1400px; border:0; display:block;"
    loading="lazy"
  ></iframe>
</div>
<script>
(function () {
  var frame = document.getElementById('solix-simulator');
  if (!frame) return;
  window.addEventListener('message', function (event) {
    if (event.source !== frame.contentWindow) return;
    if (!event.data || event.data.type !== 'mc-solix-height') return;
    var height = Number(event.data.height);
    if (!Number.isFinite(height) || height < 500 || height > 10000) return;
    frame.style.height = Math.ceil(height + 8) + 'px';
  });
})();
</script>
